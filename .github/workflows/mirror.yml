name: 'mirror'
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    name: mirror
    steps:
      - name: mirror
        id: mirror
        uses: bridgelightcloud/github-mirror-action@v3
        with:
          origin: 'https://codeberg.org/keyb/navy'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
