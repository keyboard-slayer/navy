[target]
name = "kernel-x86_64"

[tools.cc]
cmd = "clang"
args = [
    "--target=x86_64-none-elf",
    "-std=gnu23",
    "-ffreestanding",
    "-mno-80387",
    "-mno-mmx",
    "-mno-3dnow",
    "-mno-sse",
    "-mno-sse2",
    "-mno-red-zone",
    "-mcmodel=kernel",
    "-fdefer-ts",
]

[tools.cxx]
cmd = "clang++"
args = [
    "--target=x86_64-none-elf",
    "-ffreestanding",
    "-mno-80387",
    "-mno-mmx",
    "-mno-3dnow",
    "-mno-sse",
    "-mno-sse2",
    "-mno-red-zone",
    "-mcmodel=kernel",
    "-fno-exceptions",
    "-fno-rtti"
]

[tools.ld]
cmd = "ld.lld"
args = [
    "-m",
    "elf_x86_64",
    "-T${path.from_here('kernel-x86_64.ld')}",
    "-z",
    "max-page-size=0x1000"
]

[tools.ar]
cmd = "llvm-ar"
args = [
    "rcs"
]

[tools.as]
cmd = "nasm"
args = [
    "-f",
    "elf64"
]


[props]
arch = "x86_64"
toolchain = "llvm"

